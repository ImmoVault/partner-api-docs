info:
  title: messpunkt.io Partner API
  version: "1.0.0-rc.3"
  summary: |
    Partner-facing read API for monthly consumption and meter data.
  description: |
    # Overview

    This API lets property-management ERPs read consumption and meter-reading
    data from messpunkt.io on behalf of a landlord (Tenant). Landlords who want
    to ask their **own AI assistant** (Claude, ChatGPT, Codex) about their data
    use the MCP server instead — see *For AI agents* below. Both share the same
    consent, the same authorization server and the same data rules.

    **Status:** `1.0.0-rc.3` · V1 release candidate · production
    (`api.messpunkt.io`, `auth.messpunkt.io`) live since 2026-09-30 against
    the landlords' real data; ERP clients are registered on request. The API
    is read-only. Planned write functions are described on the
    [roadmap](./roadmap/), not in this document.

    **Coming from rc.2?** rc.3 contains four breaking changes (monthly data
    resolution, nullable `active_device`, nullable `installed_at`, nullable
    `usage_unit_id`). Read *Migrating from rc.2* below before you upgrade.

    # API stability & versioning

    messpunkt.io commits to the following contract for anything under `/v1`:

    - **SemVer for the OpenAPI document** — `major.minor.patch`. The
      current `version` string is always machine-readable at the top of
      [erp-api-openapi.yaml](./erp-api-openapi.yaml).
    - **No breaking changes within `/v1` after GA.** Field removals, enum-value
      removals, type changes and semantic shifts are **major-version**
      changes that require a new path prefix (`/v2`). We run the previous
      major in parallel for at least **6 months** after the new one GAs.
    - **Deprecations are announced in writing.** Any field or endpoint we
      intend to sunset will carry `deprecated: true` in the OpenAPI
      document and emit a `Sunset: <RFC 8594 date>` header on affected
      responses, with **at least 6 months overlap** before removal.
    - **Additive changes are not breaking.** New fields on a response,
      new enum values, new optional query parameters, new endpoints, new
      scopes — these ship in **minor** releases and do not require partner
      action. Clients must ignore unknown fields and must tolerate unknown
      enum values.
    - **Bug fixes, clarifications and documentation-only edits** are
      **patch** releases.
    - **Release candidate phase (current).** rc.2 promised that core types
      would no longer be reshaped. **rc.3 breaks that promise once, on
      purpose**: the published contract described data messpunkt.io does not
      have, a resolution it must not deliver, and no way to reach the total
      meters of a plant room (see *Migrating from rc.2*).
      Correcting that before the first partner goes live is cheap; afterwards
      it would be a `/v2`. From rc.3 on, `UsageUnit`, `MeasuringPoint`,
      `DeviceSegment` and `MeterReading` change only additively.

    See [/changelog/](./changelog/) for the full release history.

    # Migrating from rc.2

    | What changed | rc.2 | rc.3 | What you need to do |
    | --- | --- | --- | --- |
    | **Data resolution** *(breaking)* | two readings per segment at arbitrary dates (`at` = date-time) | one reading per **calendar month end** (`at` = date); `from`/`to` widened to whole months | Parse `at` as a date. Stop expecting exactly two readings. Use `period_consumption` for billing. |
    | **Billable consumption** | ERP computed `last − first` | `period_consumption.billable_value` per segment (raw consumption × `factor`) | Sum `billable_value` across segments. Do not subtract readings yourself for billing. |
    | **`MeasuringPoint.active_device`** *(breaking)* | required object | object **or `null`** (difference meters, removed devices) | Handle `null`. |
    | **`installed_at`** on `Device` / `DeviceSegment` *(breaking)* | required date | date **or `null`** (installation date not documented) | Handle `null`; never substitute a made-up date. |
    | **`MeasuringPoint.usage_unit_id`** *(breaking)* | required UUID | UUID **or `null`** (measuring point of a plant room or a main meter, whose area is allocated to no usage unit); `property_id` is now always set and such measuring points are listed by the new `GET /properties/{id}/measuring-points` | Handle `null`. Read plant-room and main meters (e.g. a total heat meter) from `GET /properties/{id}/measuring-points`. |
    | `ReadingStatus` | 4 values | + `calibration_expired` | Never bill a value with this status. |
    | `SubstitutionMethod` | 3 values | + `weighted_recent_2values`, `weighted_recent_3values`, `baseline_fallback`, `baseline_single_value` | Treat as informational. |
    | `replacement_reason` | `EndOfLife`, `Defect`, … | + `DeviceReplacement` (the value you will actually see) | Map `DeviceReplacement` to "meter swap". |
    | `Metric` | 6 values | + `water_outdoor` | Keep outdoor water out of tenant water billing. |
    | `DeviceSegment` | — | + `baseline_value`, `baseline_date`, `factor`, `period_consumption` | Use them. |
    | `MeterReading` | — | + `is_synthetic` | Show "calculated" values differently if you display readings. |
    | `MeasuringPoint` | — | + `is_difference_meter` | Expect no device and no readings for these. |
    | `obis`, `resolution`, `external_ref` | documented as populated | always `null` today | Do not rely on them. |

    # Data resolution: monthly, never finer

    messpunkt.io delivers consumption data **per calendar month and per
    billing-relevant boundary only**. There are no daily, hourly or
    per-telegram values in this API, and no query parameter unlocks them.

    **Why:** Radio meters report several times a day. A series that fine,
    per apartment, shows when people are at home, shower, cook or are away —
    a behavioural profile of the residents. Heating-cost billing
    (HeizkostenV) needs period values, not profiles, and the GDPR principle of
    data minimisation (Art. 5(1)(c)) does not let us hand out more than the
    purpose needs. The landlord portal applies the same rule, so an ERP sees
    exactly what the landlord sees.

    What you get instead:

    - **Month-end readings** (`readings[]`): the meter value at the end of each
      calendar month inside the query range — either the value the device
      stored itself for that day (*Stichtagswert*) or a value messpunkt.io
      interpolated at the month boundary (`is_synthetic: true`).
    - **Period consumption per device segment** (`period_consumption`): the
      billable consumption of that device inside the query range, computed the
      same way as in the landlord portal.
    - **Segment boundaries**: the start value of a device (`baseline_value`,
      `baseline_date`) and its end value. These fall on installation or
      removal dates, which are part of the device record, not a usage series.

    # Sandbox

    A **live sandbox** is running now so partners can experiment end-to-end
    with a realistic OAuth 2.1 flow and synthetic data:

    | Host | Purpose |
    | --- | --- |
    | `https://api.sandbox.messpunkt.io/v1` | Sandbox API endpoints |
    | `https://auth.sandbox.messpunkt.io` | Sandbox OAuth 2.1 authorization server |

    Click **Authorize** in Swagger UI (or *Test Request* in Scalar). The
    browser is redirected to the sandbox consent screen, where a single
    demo landlord — "Musterhausverwaltung GmbH" — is already logged
    in. *All Properties* is pre-selected: approve, or switch to *only
    selected* and tick Properties; the viewer then completes the token
    exchange automatically.

    **Sandbox specifics**

    - **Data:** 100 % synthetic (addresses like *Musterstraße 12, 99999 Musterstadt*).
      No real customer data; a CI-gated linter keeps personal data out of the fixture.
    - **DPoP:** optional, exactly as in production. Plain `Bearer` tokens work,
      so Swagger UI (which doesn't generate DPoP proofs) can exercise all
      endpoints. See *Authentication*.
    - **Rate limits:** the same numbers and counting keys as in production
      (see *Rate limits* under *Conventions*). Counted in memory per server
      instance, best effort: the effective limit can be higher than the
      number, never lower.
    - **Token lifetimes:** access 1 h, refresh 90 days. There is
      **no absolute session cap** — a session stays valid as long as the
      ERP rotates its refresh token at least every 90 days. Built for
      long-lived B2B integrations: the landlord consents once, the ERP runs
      for years.
    - **Refresh-token rotation:** each successful `grant_type=refresh_token`
      call issues a new refresh token and invalidates the previous one.
      Presenting a pre-rotation refresh token (replay) revokes the entire
      session — including the legitimate current token. Callers must persist
      the newest refresh token immediately after each refresh and treat
      any `invalid_grant` response as "start a new authorization flow."
    - **Property-scope enforcement** is identical to production —
      querying a Property outside your selected scope returns `404`.
    - **Stateless by design:** no writes, no persistence. Same fixture
      every time.
    - **Static data until 2026-12-31.** The fixture holds month-end values
      up to December 2026 and is not extended automatically. From 2027 on,
      the latest months stop looking "current": a range that reaches past
      December 2026 is shortened to end on `2026-12-31` (check the echoed
      `to`), and a range that starts after it returns no values.
    - **Not every status is demonstrated.** The sandbox fixture contains no
      `substituted` values; you can read the status in this document and in
      the examples of `GET /measuring-points/{id}/readings`, but not try it
      out against the sandbox.

    **Since 2026-09-30 the sandbox serves the rc.3 contract**, including
    `resource` (RFC 8707) and `/oauth/revoke` (announced in the changelog).

    # Authentication

    All endpoints require an access token from **OAuth 2.1 Authorization Code
    + PKCE (S256)**. Tokens are issued for exactly one Tenant and are
    additionally restricted to the Properties the landlord selected.

    Connect flow:

    1. Landlord clicks "Connect messpunkt.io" inside the ERP.
    2. ERP redirects the browser to `/oauth/authorize` with
       `response_type=code`, `code_challenge_method=S256`, `code_challenge`,
       `scope`, `client_id`, `redirect_uri`, `state` and
       `resource=https://api.messpunkt.io` (RFC 8707).
    3. Landlord signs in with their messpunkt.io portal account.
    4. **Consent screen** shows your application's name, the requested scopes
       and lets the landlord choose which Properties you may see: *all
       Properties, including future ones*, or a selection (see *Authorization
       & Property scope*).
    5. Browser is redirected back with `code`, `state` and `iss` (RFC 9207).
       Check that `iss` equals the authorization server you started with.
    6. ERP exchanges the code at `/oauth/token` with the PKCE verifier and the
       same `resource`.
    7. ERP receives an access token (≤ 1 h, `aud` = the requested resource,
       carrying the Property selection) and a rotating refresh token.

    Every request to the API carries `Authorization: Bearer <access_token>`,
    or — if you use DPoP — `Authorization: DPoP <access_token>` plus a
    `DPoP: <proof JWT>` header.

    **Prerequisite on the landlord side:** API access is part of the
    landlord's contract with messpunkt.io and is enabled per organisation. If
    it is not enabled, the consent screen shows a notice instead of a consent
    form.

    **ERP clients** are registered by messpunkt.io — write to
    [kontakt@messpunkt.io](mailto:kontakt@messpunkt.io). Registered clients
    authenticate at the token endpoint with `private_key_jwt` (preferred) or
    `client_secret_basic`. The sandbox uses the public demo client
    `sandbox-demo-client` (PKCE only, no client secret).

    **Revocation:** a client ends its own session with `POST /oauth/revoke`
    (RFC 7009). The landlord can disconnect any application in the
    messpunkt.io portal (*Verbundene Anwendungen*); access and refresh stop
    working within 60 seconds.

    ## DPoP (optional)

    DPoP (RFC 9449) is **supported and optional**. If you send a DPoP proof
    to `/oauth/token`, the access token is bound to your key (`cnf.jkt`), and
    every API request with that token must use `Authorization: DPoP` together
    with a valid proof — the server checks `htm`, `htu`, `iat` (±60 s), `jti`
    replay, `ath` and the key thumbprint. A bound token presented as `Bearer`
    is rejected. Tokens obtained without a proof are plain bearer tokens.
    messpunkt.io can make DPoP mandatory for an individual registered client
    on request. See the [DPoP guide](./dpop/).

    # Conventions

    - Media type: `application/json`; errors use `application/problem+json`
      (RFC 7807, see *Errors*).
    - Dates: ISO 8601 calendar dates (`2025-12-31`). Timestamps (`token_expires_at`): ISO 8601 UTC.
    - IDs: UUID.
    - Pagination: cursor-based (`page_cursor`, `next_cursor`, `prev_cursor`).
    - Versioning: `/v1` path prefix; deprecations signalled with `Sunset` header + 6 months overlap.
    - Rate limits (production and sandbox): `429 Too Many Requests` with a
      `Retry-After` header (seconds) on exceedance.
      - `/v1/*`: 300 requests per minute per connection (grant, the access
        token's `sid`), counted after the token is validated. Requests whose
        token fails validation are counted per caller address.
      - `/oauth/token` and `/oauth/revoke`: 60 requests per minute per
        `client_id`, counted after successful client authentication, and in
        addition 60 per minute per caller address.
      - `/oauth/authorize`: 60 requests per minute per caller address.
      - MCP server for landlords: 60 requests per minute per connection (grant).

      The `/v1/*` limit is per connection, not per `client_id` or address:
      one ERP system serves many landlords from one address, and addresses
      behind proxies are unreliable. Limits are counted in memory per server
      instance, so the effective limit can be higher, never lower.

    ## Errors

    Every non-2xx response of a `/v1` endpoint is an `application/problem+json`
    document. `type` is `https://developer.messpunkt.io/errors/#<code>` in
    sandbox and production alike, and that address documents the code.
    Branch on the fragment (the part after `#`), not on `title`. The
    authorization server answers `429` in the same form
    (`#too-many-requests`); its other errors use the OAuth format.

    | Status | `type` fragment | Meaning | Retry? |
    | --- | --- | --- | --- |
    | `400` | `invalid-request` | malformed request, e.g. `from` not a date, `to` before `from`, a range that starts after the last completed month, an unknown `metric` value, an invalid `limit`, `page_cursor` or `property_id`; `detail` names the problem | no — fix the request |
    | `401` | `invalid-token` | token missing, expired, not an access token, wrong audience, or DPoP proof invalid | after refreshing the token |
    | `403` | `insufficient-scope` | token lacks the scope this endpoint needs | no — re-authorize with the scope |
    | `404` | `resource-not-found` | resource does not exist **or** lies outside your Property scope; also for an `{id}` in the path that is not a UUID | no — see *Implications for ERP clients* |
    | `429` | `too-many-requests` | rate limit exceeded | yes, after `Retry-After` seconds |
    | `500` | `internal-error` | unexpected server error; no `detail` | yes, with exponential backoff; quote `trace_id` if it persists |
    | `503` | `service-unavailable` | a dependency needed to check the token or the connection is unavailable; no `detail`. The request was not served — never answered with data | yes, with exponential backoff |

    A `401` also carries a `WWW-Authenticate` header (RFC 6750 / RFC 9449)
    naming the error. OAuth endpoints (`/oauth/*`) answer in the OAuth error
    format (`error`, `error_description`). The full table with client actions
    is on the [error-handling page](./errors/).

    # Canonical model

    ```
    Tenant                      (landlord organisation)
    └─ Property                 (Liegenschaft)
       └─ Address
          ├─ UsageUnit          (Wohn-/Gewerbeeinheit)
          └─ Sector             (area a meter set belongs to)
             └─ MeasuringPoint  (stable across device replacements)
                └─ Device segments (installation windows)
                   └─ month-end readings + period consumption

    Sector ⇄ UsageUnit: allocation (usually one unit per sector; none for a plant room)
    ```

    `UsageUnit` is the ERP-facing resource for billing queries.
    `MeasuringPoint` is stable across device replacements. Device segments
    carry installation windows so meter replacement is explicit in the schema.

    **Sectors and units.** Measuring points belong to a *Sector*, not directly
    to a unit; a Sector is allocated to one or more UsageUnits, each with a
    share. In the vast majority of properties that allocation is one-to-one
    (share `1`), and `usage_unit_id` names that unit.

    **Shared Sectors** (one Sector allocated to several UsageUnits, e.g. a
    shared water meter):
    - `MeasuringPoint.usage_unit_id` is the **primary unit** — the unit with
      the highest share (tie: the smallest id). `MeasuringPoint.allocations[]`
      lists every unit with its `share`, largest first.
    - The measuring point is listed under **every** unit with a share
      (`UsageUnit.measuring_points`, `/usage-units/{id}/consumption`), with
      that unit's `unit_share`.
    - **Device values are never weighted:** readings, `value` and
      `billable_value` are the device's values. In
      `/usage-units/{id}/consumption` each segment additionally carries
      `period_consumption.weighted_billable_value` = `billable_value` ×
      `unit_share` — the same weighting the residents' portal uses. Bill a
      unit with `weighted_billable_value`; summed over the units of a Sector
      it gives the Sector's consumption (up to rounding), so a shared
      measuring point is never counted twice.
    - **Rule:** the sum of `weighted_billable_value` over all units of a
      shared measuring point equals that measuring point's consumption
      (sum of its `billable_value`, up to rounding). When billing units,
      always sum `weighted_billable_value` — **never** sum `billable_value`
      per unit: that bills a shared meter in full to every unit.
    - *(Changed in rc.3 addendum:* rc.3 said values are "per device and never
      pre-weighted" and left shared Sectors open. Device values stay
      unweighted; the per-unit weighted value is new.)

    **Sectors without a share** (a plant room, the boiler room, the main
    water meter): the Sector is allocated to **no** UsageUnit. Its
    measuring points are still delivered — they are what a heating-cost
    statement needs as the property's total:
    - `MeasuringPoint.usage_unit_id` is `null` and `allocations` is empty;
      `property_id` names the Property.
    - They are **not** listed under any unit (`UsageUnit.measuring_points`)
      and are **not** part of any `/usage-units/{id}/consumption`. List them
      with `GET /properties/{id}/measuring-points`; read a single one with
      `GET /measuring-points/{id}` and its values with
      `GET /measuring-points/{id}/readings`.
    - Such a measuring point is never distributed over the units: it is
      the property's own total, not a unit's consumption. Whether and how
      a total is split among units is your billing rule.
    - *(Added in rc.3, breaking: `usage_unit_id` became nullable.)*

    **Difference meters.** Some measuring points carry no device of their own:
    their consumption is the remainder of a sum meter minus all other meters
    behind it. They are marked `is_difference_meter: true`, have
    `active_device: null` and no readings. V1 does not deliver a consumption
    value for them.

    **Measuring points without a system link.** messpunkt.io assigns each
    measuring point to a heating or water system (Anlage). A measuring point
    without an active assignment is still delivered, with its readings and
    period consumption, and is marked `is_system_linked: false`. The landlord
    portal shows **0** consumption for such a measuring point, because its
    monthly figures only count system-linked measuring points; this API
    delivers the device values instead. Treat `false` as a data-quality hint
    and clarify it with the landlord before billing. An absent field means
    `true`.

    **Pre-metering (Vorerfassung) is not exposed.** A pre-metering point
    measures a total that other meters then split up (e.g. the warm-water share
    of a central heat meter). Delivering it next to the meters behind it would
    count the same consumption twice, so V1 leaves it out. Consequence: the sum
    over all UsageUnits of a Property is **not** the building's total — the
    difference is common or unallocated consumption.

    ## Multi-Property Tenants

    A single Tenant (Hausverwaltung / property-management organisation)
    typically owns multiple `Property` records (Liegenschaften), each with
    its own address(es) and many UsageUnits. The API exposes both levels:

    - `GET /properties` — enumerate Properties in the Tenant
      (use this to populate a two-step picker in the ERP UI:
      *first pick the Liegenschaft, then the Wohneinheit*)
    - `GET /usage-units?property_id=…` — list units filtered to one Property
    - `GET /properties/{id}/measuring-points` — every measuring point of one
      Property, **including those that belong to no unit** (plant room, main
      meters; `usage_unit_id: null`)
    - `GET /usage-units` (no filter) — flat list of all units in the Tenant
      (fine for Tenants with one Property, or ERPs that don't need grouping)

    Every `UsageUnit` also carries a lightweight `property` summary
    (`id`, `name`, short address) so a single `/usage-units` call is
    self-describing for small Tenants.

    **Important:** the endpoints above are additionally filtered by the
    token's `property_scope` — see the next section.

    # Authorization & Property scope

    Authentication (OAuth 2.1) proves *who* is calling. **Authorization**
    decides *what data* the caller is allowed to see within the Tenant.

    ![Authentication and Authorization flow](/auth-flow.svg)

    *The diagram covers consent with Property picker, authorized runtime
    requests with server-side scope filtering, and later changes from the
    landlord side. Source: `auth-flow.mmd` (Mermaid sequence diagram).*

    Because a Tenant often owns Properties that should not all be
    exposed to every ERP (different management mandates, pilot rollouts,
    data-protection boundaries), the API supports a **Property selection
    per connection**.

    ## How it works

    - **At consent time** the landlord chooses *all Properties, including
      future ones* (pre-selected), or picks individual Properties.
    - The resulting access token carries a `property_scope` claim — either
      the literal string `"all"` or a list of Property UUIDs.
    - **Every API response is filtered** server-side against this
      selection. Endpoints that target a single Property, UsageUnit or
      MeasuringPoint return **`404 Not Found`** if the resource is outside
      the selection — we deliberately do **not** return `403 Forbidden`, so
      the existence of out-of-scope Properties is not leaked to the ERP.
    - `GET /whoami` exposes the current `property_scope` so an ERP can
      display "you have access to N Properties" before issuing queries.

    ## Changes from the landlord side

    - **Disconnecting** an application in the portal ends access and refresh
      within 60 seconds — the connection is checked on every request, not only
      on refresh.
    - **Changing the Property selection** means reconnecting: the landlord
      disconnects and goes through the consent screen again.

    ## Implications for ERP clients

    - Always call `GET /whoami` after obtaining or refreshing a token and
      reconcile the local Property list.
    - Treat `404` on previously-known Property or UsageUnit IDs as a
      signal that access was revoked — surface a user-friendly message
      to the landlord and prompt a refresh of the picker.
    - Do not cache Property-level data across token refreshes without
      re-checking `property_scope`.

    # For AI agents

    ## MCP server for landlords

    Landlords who want to ask their own assistant — *"Wie hoch war der
    Wärmeverbrauch 2025 in der Musterstraße 12?"* — connect it to the
    messpunkt.io **MCP server** (Model Context Protocol):

    | | |
    | --- | --- |
    | Server URL | `https://mcp.messpunkt.io/v1` |
    | Clients | Claude (claude.ai, Claude Code), ChatGPT, Codex and other MCP clients with OAuth support |
    | Tools (read-only) | `list_properties`, `get_property_overview`, `get_consumption`, `get_device_status`, `get_connection_info` |
    | Tool reference | [developer.messpunkt.io/mcp/](https://developer.messpunkt.io/mcp/#tools) — input and output schemas generated from the server's `tools/list`; not repeated in this document |
    | Auth | same authorization server and consent screen as this API; token audience `https://mcp.messpunkt.io/v1` |
    | Data rules | same as this API — monthly values, Property scope, `404` outside the scope |

    The MCP server and the production REST API are live since 2026-09-30
    (access enabled per customer organisation); the setup guide for each
    client is published at developer.messpunkt.io/connect/.
    Tokens for the MCP server are not accepted by this REST API and vice versa.

    ## REST API from agents

    This REST API remains the interface for ERP systems. Agents built on
    tool calling can use it too — see the discovery artifacts:

    - **[llms.txt](https://developer.messpunkt.io/llms.txt)** — llms.txt-standard index of the documentation
    - **[.well-known/ai-plugin.json](https://developer.messpunkt.io/.well-known/ai-plugin.json)** — plugin-style manifest pointing at this spec
    - **[.well-known/security.txt](https://developer.messpunkt.io/.well-known/security.txt)** — RFC 9116 responsible-disclosure contact
    - **[erp-api-openapi.yaml](https://developer.messpunkt.io/erp-api-openapi.yaml)** — this document, the authoritative machine-readable contract

    OpenAPI 3.1 operation schemas convert cleanly to Anthropic Tool Use
    (Claude), OpenAI Function Calling and Google Gemini / Vertex AI Function
    Calling. Identify quantities by `metric` + `unit`; `obis` is not populated
    today.

    ## Typical questions

    - *"How much warm water did apartment WE 03 use in 2025 compared to 2024?"*
      → two `GET /usage-units/{id}/consumption` calls, sum
      `period_consumption.billable_value` per call
    - *"Are any units in Musterstraße 12 showing unusually high heat
      consumption?"* → `GET /properties`, then
      `GET /usage-units?property_id=…`, then per-unit consumption
    - *"When was the water meter in WE 03 last replaced?"* →
      inspect `DeviceSegment.deinstalled_at` and `.replacement_reason`
      in the consumption response
    - *"Which Properties is this ERP allowed to see?"* → `GET /whoami`

    ## Constraints for agent authors

    - Always call `GET /whoami` after a token refresh to reconcile the
      current `property_scope`
    - `404` on a previously-known resource = scope revocation, not a
      retry condition. Surface this to the user.
    - The REST API has no fields for resident (Mieter) names or contact
      details. `UsageUnit.name` is the label the landlord gave the unit.
    - Values are monthly at the finest (see *Data resolution*). There is
      no parameter for daily or per-telegram data, and there will not be.

    # Metrics and units

    `metric` says what a measuring point measures; it follows the measuring
    point, not the radio type byte of the device fitted there. Every metric
    has exactly one unit, so ERPs never convert units.

    | `metric` | Meter | `unit` | Notes |
    | --- | --- | --- | --- |
    | `heat` | Wärmezähler (WMZ) | `kWh` | |
    | `hca` | Heizkostenverteiler (HKV) | `unit` | raw allocator units; multiply by `factor` |
    | `water_cold` | Kaltwasserzähler | `m3` | |
    | `water_warm` | Warmwasserzähler | `m3` | |
    | `water_outdoor` | Außenwasserzähler (Garten, Sprengwasser) | `m3` | **not** part of the water billed to residents — keep it separate |
    | `electricity` | Stromzähler | `kWh` | reserved — messpunkt.io has no readable electricity meters today; you will not receive values |
    | `gas` | Gaszähler | `m3` | reserved — messpunkt.io has no readable gas meters today; you will not receive values |

    **OBIS codes** (`obis`) are not supported: the field is
    **always `null` today**. messpunkt.io does not store OBIS codes per
    measuring point; an OBIS value derived from `metric` alone would add no
    information.

    # Meter readings and consumption

    Two endpoints return the same nested shape:

    | Endpoint | Scope | Typical use |
    | --- | --- | --- |
    | `GET /usage-units/{id}/consumption` | all MeasuringPoints of one UsageUnit | unit-level billing export |
    | `GET /measuring-points/{id}/readings` | one MeasuringPoint (also one without a unit, e.g. a total heat meter) | drill-down / reconciliation |

    Per MeasuringPoint the response holds one `DeviceSegment` per continuous
    device installation window inside the query range. A meter replacement
    always starts a new segment.

    ## Query range

    `from` and `to` are calendar dates. The range is **widened to whole
    months** (`from` → first day of its month, `to` → last day of its month)
    and capped at the end of the last completed month. The response echoes
    the effective range in `from` / `to`. A range that lies entirely after
    the last completed month (for example only the running month) has no
    month-end data yet and is rejected with `400 invalid-request`; `detail`
    names the last completed month.

    ## Per segment

    - `baseline_value` / `baseline_date` — the value the segment's
      consumption is measured from. If the device was already installed
      before the range, this is the month-end value of the month before
      `from` (so it lies **before** `from`). If the device was installed
      inside the range, it is the device's start value at installation —
      **not necessarily 0**. If the installation date is unknown
      (`installed_at: null`), it is the month-end value before `from` when
      one exists, otherwise the first value known for the device — which
      can lie **inside** the range.
    - `baseline_origin` — where `baseline_value` comes from (`recorded`,
      `assumed_zero`, `first_reading`, `portal_rule`,
      `month_end_before_range`, `first_known_in_range`, `none`; see
      `BaselineOrigin`). `assumed_zero` means the start value of a
      replacement heat cost allocator was **not recorded** and is assumed to
      be 0 — the consumption of that segment rests on this assumption.
      *(Added in rc.3 addendum; optional.)*
    - `installed_at` / `deinstalled_at` — set only when the date is
      documented. An unknown installation date is `null`, never a
      placeholder.
    - `readings[]` — one `MeterReading` per calendar month end inside both
      the range and the installation window, in ascending order. Months
      without any value are omitted.
    - `period_consumption` — end value, raw consumption, `factor` and the
      **billable value**. This is the number the landlord portal uses.
      - *Device removed inside the range:* `end_date` is the removal date
        and `end_value` the meter value on that day, with status `measured`
        (`missing` if the value at removal is not known). If the removal
        date is a month end, the same value also appears as that month's
        reading.
      - *No value at the end of the range:* the end value is **not carried
        forward** from an earlier month. `status` is `missing` and
        `end_value`, `value` and `billable_value` are `null` — unless the
        value is extrapolated (`substituted`), which messpunkt.io does not
        produce today (see *Value status*).
    - `factor` — multiplier from raw to billable consumption (K-factor /
      Bewertungsfaktor for heat cost allocators, usually `1` for all other
      meters).

    **Billable consumption of a MeasuringPoint** = sum of
    `period_consumption.billable_value` over its segments. **For a
    UsageUnit**, sum `period_consumption.weighted_billable_value` instead:
    it equals `billable_value` for a measuring point the unit does not share
    (`unit_share: 1`) and is the unit's share otherwise (see *Shared Sectors*
    under *Canonical model*). Do not compute
    billing values as `last reading − first reading`: that misses the
    baseline before `from`, the start value of a replacement device and the
    factor.

    ## Value status

    | `status` | `is_synthetic` | Meaning |
    | --- | --- | --- |
    | `measured` | `false` | value reported by the device for that date (telegram or device-stored Stichtagswert) |
    | `calculated` | `true` | interpolated by messpunkt.io at the month boundary between two real readings (`substitution_method` says how) |
    | `substituted` | `true` | extrapolated because the device has not reported since; only at the end of a range, from readings at most 20 days old. **Not produced today** — see below |
    | `missing` | — | no value could be determined; only on `period_consumption` (then `end_value`, `value` and `billable_value` are `null`) |
    | `calibration_expired` | `false` or `true` | the device's statutory calibration period (Eichfrist) had ended; the value is shown but **must not be billed** — `billable_value` is `0`. `is_synthetic: true` when the value was interpolated at the month boundary; `substitution_method` is then `null` |

    A MeasuringPoint without any value in the range has `data_gap: true`.

    **`substituted` is not produced today.** A range always ends at a
    completed month end, and for month ends messpunkt.io stores only
    interpolated (`calculated`) values. `substitution_method` therefore
    appears only on `calculated` values: `degree_day_weighted` for heat
    meters and heat cost allocators, `linear_interpolation` for all other
    meters. The value and its methods stay in the contract; handle them if
    they appear.

    ## Precision

    `DeviceSegment.resolution` is reserved and **always `null` today** —
    messpunkt.io does not record the smallest increment of each device.
    `calculated` and `substituted` values can carry more decimals than the
    device resolves; round for display as your billing rules require.

    MID / EN / IEC accuracy classes are not exposed in V1.

    **References**
    - EN 1434 (Wärmezähler / heat meters)
    - EN 13757 (M-Bus / wireless M-Bus, sub-metering)
    - VDI 2067 (degree-day weighting used for `degree_day_weighted`)
    - VDI 2170 (Heizkostenverteiler / HCA)
    - MID Directive 2014/32/EU (Measuring Instruments Directive): https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32014L0032
    - Heizkostenverordnung (HeizkostenV): https://www.gesetze-im-internet.de/heizkostenv/
