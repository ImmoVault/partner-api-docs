                              - { at: "2025-02-28", value: 419.377, status: "calculated", is_synthetic: true, substitution_method: "linear_interpolation" }
                              - { at: "2025-03-31", value: 422.950, status: "measured",   is_synthetic: false }
                              - { at: "2025-04-30", value: 426.101, status: "measured",   is_synthetic: false }
