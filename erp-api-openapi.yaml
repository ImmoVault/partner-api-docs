                params={"from": "2025-01-01", "to": "2025-03-31"},
                headers={"Authorization": f"Bearer {access_token}"},
            )
            for seg in r.json()["segments"]:
                for rd in seg["readings"]:
                    flag = " (calculated)" if rd["is_synthetic"] else ""
                    print(seg["serial"], rd["at"], rd["value"], flag)
