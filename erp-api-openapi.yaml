        "400":
          description: Invalid query range — fix the request, do not retry.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                to_before_from:
                  summary: "`to` before `from`"
                  value:
                    type: "https://developer.messpunkt.io/errors/#invalid-request"
                    title: "Invalid request"
                    status: 400
                    detail: "to must be on or after from"
                    trace_id: "3f9c2a71b0d84e15"
                invalid_date:
                  summary: "`from` or `to` not an ISO 8601 date (a missing one: `from is required and must be an ISO 8601 date (yyyy-MM-dd).`)"
                  value:
                    type: "https://developer.messpunkt.io/errors/#invalid-request"
                    title: "Invalid request"
                    status: 400
                    detail: "from must be an ISO 8601 date (yyyy-MM-dd); got '2025-13-01'."
                    trace_id: "9a41c7e05b2d386f"
                range_after_last_completed_month:
                  summary: Range lies entirely after the last completed month
                  value:
                    type: "https://developer.messpunkt.io/errors/#invalid-request"
                    title: "Invalid request"
                    status: 400
                    detail: "The range starts after the last completed month (2026-08-31); no month-end data exists yet."
                    trace_id: "e6b03f9d27c4a158"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

components:

  securitySchemes:
    OAuth2:
      type: oauth2
      description: |
        OAuth 2.1 Authorization Code with PKCE (S256, mandatory). Send
        `resource` (RFC 8707) on `/oauth/authorize` and `/oauth/token`. DPoP (RFC 9449) is supported and optional: a
        token obtained with a DPoP proof is bound to your key and must then
        be sent as `Authorization: DPoP` with a `DPoP` proof header on every
        request. See *Authentication* in the API overview. The URLs below
        are the sandbox ones, so the try-it-out viewers work; production uses
        `https://auth.messpunkt.io` with the same paths and
        `resource=https://api.messpunkt.io`.
      flows:
        authorizationCode:
          # Sandbox endpoints, for the try-it-out viewers. Production:
          # https://auth.messpunkt.io, same paths.
          authorizationUrl: https://auth.sandbox.messpunkt.io/oauth/authorize
          tokenUrl: https://auth.sandbox.messpunkt.io/oauth/token
          refreshUrl: https://auth.sandbox.messpunkt.io/oauth/token
          # Scalar-specific: prefill the public sandbox client in the
          # Authorize panel so partners don't need to paste a client ID.
          # Scope pre-selection is configured in scalar/index.html via
          # authentication.securitySchemes.OAuth2.flows.authorizationCode.selectedScopes.
          x-scalar-client-id: sandbox-demo-client
          scopes:
            "read:units":    Read Properties, UsageUnits, Addresses and structural metadata.
            "read:devices":  Read MeasuringPoints and Device lifecycle.
            "read:readings": Read month-end readings and period consumption.

  parameters:
    PageCursor:
      name: page_cursor
      in: query
      required: false
      description: Opaque cursor returned by a previous response. Omit for first page.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      description: Max items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    ExternalRef:
      name: external_ref
      in: query
      required: false
      description: |
        **Not functional today.** messpunkt.io does not store ERP
        references, so `external_ref` is `null` on every resource and any
        non-empty value of this filter matches nothing (the response is an
        empty page). Do not use it to look up resources.
      schema: { type: string }
    From:
      name: from
      in: query
      required: true
      description: |
        Start of the query range (ISO 8601 date, inclusive). Widened to the
        first day of its month.
      schema: { type: string, format: date }
      example: "2025-01-01"
    To:
      name: to
      in: query
      required: true
      description: |
        End of the query range (ISO 8601 date, inclusive). Widened to the
        last day of its month and capped at the end of the last completed
        month. Must not be before `from` (otherwise `400`). If the whole
        range lies after the last completed month, the request is rejected
        with `400`.
      schema: { type: string, format: date }
      example: "2025-12-31"
    PropertyId:
      name: id
      in: path
      required: true
      description: Property ID (UUID).
      schema: { type: string, format: uuid }
    UsageUnitId:
      name: id
      in: path
      required: true
      description: UsageUnit ID (UUID).
      schema: { type: string, format: uuid }
    MeasuringPointId:
      name: id
      in: path
      required: true
      description: MeasuringPoint ID (UUID).
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: |
        Missing, expired or invalid token — including a refresh token sent as
        access token, a token for another audience, or a failed DPoP proof.
        Refresh the token and retry once; if refresh fails, restart the
        authorization flow.
      headers:
        WWW-Authenticate:
          description: 'RFC 6750 / RFC 9449 challenge, e.g. `Bearer error="invalid_token"`.'
          schema: { type: string }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: "https://developer.messpunkt.io/errors/#invalid-token"
            title: "Missing or invalid token"
            status: 401
            trace_id: "a07e5d3c91f24b68"
    Forbidden:
      description: Token valid, but it lacks the scope this endpoint requires.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: "https://developer.messpunkt.io/errors/#insufficient-scope"
            title: "Scope insufficient"
            status: 403
            detail: "This endpoint requires the read:readings scope. Request it in the authorization flow and ask the landlord to connect again."
            trace_id: "5b1d8e20c7a94f33"
    NotFound:
      description: |
        The resource does not exist, or it exists outside the Property scope
        of this connection. The two cases are deliberately indistinguishable.
        An `{id}` in the path that is not a UUID is answered the same way.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: "https://developer.messpunkt.io/errors/#resource-not-found"
            title: "Resource not found"
            status: 404
            detail: "Property d490d09c-46cc-498e-a9ac-e031dd2402d2 not found in this Tenant's scope"
            trace_id: "e9048b1072c8443b"
    TooManyRequests:
      description: Rate limit exceeded. Retry after the period in `Retry-After`.
      headers:
        Retry-After:
          description: Seconds until the client may retry.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: "https://developer.messpunkt.io/errors/#too-many-requests"
            title: "Too many requests"
            status: 429
            detail: "Rate limit of 300 requests per 60s exceeded. Retry in 12s."
    InternalError:
      description: |
        Unexpected server error. The body carries no `detail` and no stack
        trace. Retry with exponential backoff; quote `trace_id` if the error
        persists.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: "https://developer.messpunkt.io/errors/#internal-error"
            title: "Internal error"
            status: 500
            trace_id: "c8157d2e904fa36b"
    ServiceUnavailable:
      description: |
        A dependency needed to check the token or the connection (signing
        keys, connection status) is temporarily unavailable. The request was
        refused, not served — the API never answers with data it could not
        authorize. No `detail`. Retry with exponential backoff.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: "https://developer.messpunkt.io/errors/#service-unavailable"
            title: "Service unavailable"
            status: 503
            trace_id: "0fa39c6b58e2d714"

  schemas:

    WhoAmI:
      type: object
      required: [tenant_id, tenant_name, client_id, granted_scopes, property_scope]
      properties:
        tenant_id:      { type: string, format: uuid }
        tenant_name:    { type: string, example: "Musterhausverwaltung GmbH" }
        client_id:      { type: string, description: "ID of the client holding the token." }
        granted_scopes:
          type: array
          items: { type: string }
          example: ["read:units", "read:readings"]
        property_scope:
          description: |
            Property-level authorization. Either the literal string `"all"`
            if the landlord exposed every Property in the Tenant (including
            Properties added later), or an array of Property UUIDs the client
            is permitted to access. See *Authorization & Property scope* in
            the API overview.
          oneOf:
            - type: string
              enum: ["all"]
            - type: array
              items: { type: string, format: uuid }
          example: ["718e092d-8626-4975-b800-252a7746ad08", "6d8be330-8f9d-4f75-b798-05a67c0074be"]
        token_expires_at:
          type: string
          format: date-time
          description: |
            Expiry of the access token (UTC), taken from the token. Omitted
            when unknown — never `null`.

    Page:
      type: object
      required: [next_cursor, prev_cursor]
      properties:
        next_cursor:
          type: [string, "null"]
          description: Opaque cursor for the next page. `null` when no more.
        prev_cursor:
          type: [string, "null"]
          description: Opaque cursor for the previous page. `null` on first page.

    Property:
      type: object
      required: [id, tenant_id, name, addresses]
      description: |
        A Liegenschaft — top-level grouping of UsageUnits under a Tenant.
        A Tenant typically owns multiple Properties, each with one or
        more addresses (Strassenzüge) and many UsageUnits.
      properties:
        id:             { type: string, format: uuid }
        tenant_id:      { type: string, format: uuid }
        external_ref:
          $ref: "#/components/schemas/ExternalRef"
        name:
          type: string
          description: Landlord-facing Liegenschafts-Name.
          example: "Musterstraße 12-14"
        addresses:
          type: array
          description: |
            Every address of this Property, including addresses without usage
            units (e.g. a separate plant-room entrance), sorted by street, house
            number, suffix and postal code.
          items: { $ref: "#/components/schemas/Address" }
        usage_unit_count:
          type: [integer, "null"]
          description: Number of UsageUnits in this Property at query time. May be null if not computed.
          example: 8

    PropertySummary:
      type: object
      required: [id, name]
      description: |
        Compact Property reference embedded inside a UsageUnit so a single
        `/usage-units` response is self-describing without a second call.
      properties:
        id:              { type: string, format: uuid }
        name:            { type: string, example: "Musterstraße 12-14" }
        address_line:
          type: [string, "null"]
          description: One-line rendering of the primary Property address for UI display.
          example: "Musterstraße 12, 99999 Musterstadt"
        external_ref:
          $ref: "#/components/schemas/ExternalRef"

    ExternalRef:
      type: [string, "null"]
      description: |
        Reserved for an ERP-side identifier. **Always `null` today** —
        messpunkt.io does not store ERP references and the API offers no
        way to write one.
      example: null

    UsageUnit:
      type: object
      required: [id, tenant_id, property_id, property, address, name]
      properties:
        id:             { type: string, format: uuid }
        tenant_id:      { type: string, format: uuid }
        property_id:    { type: string, format: uuid }
        property:
          $ref: "#/components/schemas/PropertySummary"
        external_ref:
          $ref: "#/components/schemas/ExternalRef"
        name:
          type: string
          description: |
            Label the landlord gave the unit, e.g. "WE 03". Free text entered
            by the landlord; the API has no separate field for resident names.
          example: "WE 03"
        floor:
          type: [string, "null"]
          description: |
            Taken from the unit's Sector with the highest allocation share —
            messpunkt.io stores floor, position and type on the Sector, not on
            the unit.
          example: "2"
        position:
          type: [string, "null"]
          description: Taken from the unit's Sector with the highest allocation share (see `floor`).
          example: "links"
        unit_type:
          $ref: "#/components/schemas/UnitType"
          description: Taken from the unit's Sector with the highest allocation share (see `floor`).
        area_heated_m2: { type: [number, "null"], example: 72.4 }
        area_ww_m2:     { type: [number, "null"], example: 72.4 }
        address:        { $ref: "#/components/schemas/Address" }
        measuring_points:
          type: array
          description: |
            Summary of MPs allocated to this unit, including those of a sector
            the unit shares with other units. Use the drill-down endpoints for
            readings.
          items: { $ref: "#/components/schemas/MeasuringPointSummary" }

    UnitType:
      type: string
      description: |
        `residential` — Wohneinheit · `commercial` — Gewerbeeinheit ·
        `technical` — Heizzentrale etc. · `traffic` — Allgemeinflächen.
      enum: [residential, commercial, technical, traffic]

    Address:
      type: object
      required: [street, house_number, postal_code, city, country_code]
      properties:
        street:             { type: string, example: "Musterstraße" }
        house_number:       { type: string, example: "12" }
        house_number_addition: { type: [string, "null"], example: "A" }
        postal_code:        { type: string, example: "99999" }
        city:               { type: string, example: "Musterstadt" }
        country_code:       { type: string, example: "DE", description: "ISO 3166-1 alpha-2. Currently always `DE`." }

    Obis:
      type: [string, "null"]
      description: |
        Reserved for an OBIS code (IEC 62056-6-1). **Always `null` today** —
        messpunkt.io does not store OBIS codes. Identify the quantity by
        `metric` and `unit`.
      example: null

    MeasuringPointSummary:
      type: object
      required: [measuring_point_id, metric, unit]
      properties:
        measuring_point_id: { type: string, format: uuid }
        metric: { $ref: "#/components/schemas/Metric" }
        obis:   { $ref: "#/components/schemas/Obis" }
        unit:   { $ref: "#/components/schemas/MetricUnit" }
        active_device_serial:
          type: [string, "null"]
          description: Serial of the installed device; `null` for difference meters and removed devices.
        is_difference_meter: { $ref: "#/components/schemas/IsDifferenceMeter" }

    IsDifferenceMeter:
      type: boolean
      default: false
      description: |
        `true` for a difference meter: a measuring point without a device of
        its own whose consumption is the remainder of a sum meter minus all
        other meters behind it. It has no device, no readings and — in V1 —
        no consumption value. See *Canonical model* in the API overview.

    IsSystemLinked:
      type: boolean
      default: true
      description: |
        `false` for a measuring point without an active assignment to a
        heating or water system (Anlage). It is delivered with its values;
        the landlord portal shows 0 consumption for it. Clarify with the
        landlord before billing. Absent means `true`. See *Canonical model*
        in the API overview. *(Added in rc.3 addendum.)*

    MeasuringPoint:
      type: object
      required: [id, usage_unit_id, property_id, metric, unit, active_device]
      properties:
        id:            { type: string, format: uuid }
        usage_unit_id:
          type: [string, "null"]
          format: uuid
          description: |
            The UsageUnit this measuring point's sector is allocated to. For a
            sector shared by several units: the **primary unit** — the unit
            with the highest share (tie: the smallest id); all units are in
            `allocations`. *(Clarified in rc.3 addendum.)*

            **`null`** when the measuring point's area is not allocated to any
            usage unit — e.g. a plant room or a main meter. Such measuring
            points are listed under the property via
            `GET /properties/{id}/measuring-points`. *(Changed in rc.3:
            was a required UUID.)*
        property_id:
          type: string
          format: uuid
          description: |
            The Property the measuring point belongs to. Always set, also
            when `usage_unit_id` is `null`. *(Added in rc.3.)*
        allocations:
          type: array
          description: |
            Every UsageUnit the measuring point's sector is allocated to, with
            its share, largest share first. One entry with `share: 1` for an
            unshared sector; empty when `usage_unit_id` is `null`. The shares of a sector normally add up to `1`.
            *(Added in rc.3 addendum.)*
          items: { $ref: "#/components/schemas/UnitAllocation" }
        metric:        { $ref: "#/components/schemas/Metric" }
        obis:          { $ref: "#/components/schemas/Obis" }
        unit:          { $ref: "#/components/schemas/MetricUnit" }
        localization:
          type: [string, "null"]
          description: Free-text mount info, e.g. "Badezimmer Steigstrang".
        is_difference_meter: { $ref: "#/components/schemas/IsDifferenceMeter" }
        is_system_linked: { $ref: "#/components/schemas/IsSystemLinked" }
        active_device:
          description: |
            The device currently installed. **`null`** for difference meters
            (`is_difference_meter: true`) and for measuring points whose device
            was removed without replacement. *(Changed in rc.3: was a required
            object.)*
          oneOf:
            - $ref: "#/components/schemas/Device"
            - type: "null"

    UnitAllocation:
      type: object
      required: [usage_unit_id, share]
      properties:
        usage_unit_id: { type: string, format: uuid }
        share:
          type: number
          exclusiveMinimum: 0
          maximum: 1
          description: The unit's share of the sector's consumption.
          example: 0.5

    Device:
      type: object
      required: [id, serial, manufacturer, installed_at]
      properties:
        id:              { type: string, format: uuid }
        serial:          { type: string, example: "12345" }
        manufacturer:
          type: string
          description: Three-letter wM-Bus manufacturer code (FLAG ID), e.g. `SON`, `QDS`, `EFE`.
          example: "SON"
        device_type:
          type: string
          description: |
            Device kind as recorded by messpunkt.io, e.g. `HeatCostAllocator`,
            `HeatMeter`, `HotWaterMeter`, `ColdWaterMeter`, `WaterMeter`.
            Informational — use `metric` for billing.
          example: "HotWaterMeter"
        installed_at:    { $ref: "#/components/schemas/InstalledAt" }
        deinstalled_at:  { type: [string, "null"], format: date }
        replacement_reason: { $ref: "#/components/schemas/ReplacementReason" }
        resolution:      { $ref: "#/components/schemas/Resolution" }
        factor:          { $ref: "#/components/schemas/Factor" }

    InstalledAt:
      type: [string, "null"]
      format: date
      description: |
        Installation date of the device at this measuring point. Set only
        when it is documented. **`null` when the date is unknown** —
        messpunkt.io never delivers a placeholder (such as `1900-01-01`) or
        the date a record was created as an installation date. The field is
        always present. *(Changed in rc.3: was a required date.)*
      example: "2025-06-12"

    ReplacementReason:
      type: [string, "null"]
      description: |
        Why the device's segment ended. `null` while the device is installed.
        - `DeviceReplacement` — the device was swapped for another one; the
          next segment of the same measuring point belongs to the new device
        - `DeviceRemoval` — the device was removed without replacement
        - `EndOfLife`, `Defect`, `PeriodEnd`, `Other` — **not assigned
          today**; messpunkt.io does not record why a device was swapped, and
          a billing-period end does not end a device segment. Kept for
          compatibility with rc.2.
      enum: [null, DeviceReplacement, DeviceRemoval, EndOfLife, Defect, PeriodEnd, Other]

    Resolution:
      type: [number, "null"]
      description: |
        Reserved for the smallest increment the device can report. **Always
        `null` today** — messpunkt.io does not record it. See *Precision* in
        the API overview.
      example: null

    Factor:
      type: number
      description: |
        Multiplier from raw to billable consumption: the K-factor
        (Bewertungsfaktor) for heat cost allocators, usually `1` for all
        other meters. `billable_value = value × factor`.
      example: 0.625

    UnitConsumption:
      type: object
      required: [usage_unit_id, from, to, measuring_points]
      properties:
        usage_unit_id:   { type: string, format: uuid }
        external_ref:
          $ref: "#/components/schemas/ExternalRef"
        from:
          type: string
          format: date
          description: Effective start of the range (first day of a month).
        to:
          type: string
          format: date
          description: Effective end of the range (last day of a completed month).
        measuring_points:
          type: array
          items: { $ref: "#/components/schemas/MeasuringPointConsumption" }

    MeasuringPointConsumption:
      type: object
      required: [measuring_point_id, metric, unit, segments]
      properties:
        measuring_point_id: { type: string, format: uuid }
        metric:             { $ref: "#/components/schemas/Metric" }
        obis:               { $ref: "#/components/schemas/Obis" }
        unit:               { $ref: "#/components/schemas/MetricUnit" }
        is_difference_meter: { $ref: "#/components/schemas/IsDifferenceMeter" }
        is_system_linked: { $ref: "#/components/schemas/IsSystemLinked" }
        data_gap:
          type: boolean
          default: false
          description: True when no segment has any value in the range.
        unit_share:
          type: [number, "null"]
          exclusiveMinimum: 0
          maximum: 1
          description: |
            Share of the queried UsageUnit in this measuring point's sector
            (`1` when the unit does not share it). Set only in
            `/usage-units/{id}/consumption`; absent in
            `/measuring-points/{id}/readings`. *(Added in rc.3 addendum.)*
          example: 1
        segments:
          type: array
          description: |
            One entry per continuous device installation window within the
            queried range. A meter replacement produces two segments. Empty
            for difference meters.
          items: { $ref: "#/components/schemas/DeviceSegment" }

    DeviceSegment:
      type: object
      required: [device_id, serial, manufacturer, installed_at, factor, readings, period_consumption]
      properties:
        device_id:        { type: string, format: uuid }
        serial:           { type: string }
        manufacturer:     { type: string }
        installed_at:     { $ref: "#/components/schemas/InstalledAt" }
        deinstalled_at:   { type: [string, "null"], format: date }
        replacement_reason: { $ref: "#/components/schemas/ReplacementReason" }
        resolution:       { $ref: "#/components/schemas/Resolution" }
        factor:           { $ref: "#/components/schemas/Factor" }
        baseline_value:
          type: [number, "null"]
          description: |
            Value the segment's consumption is measured from: the month-end
            value before `from` if the device was installed earlier, or the
            device's start value at installation (not necessarily 0). `null`
            if no start value is known.
          example: 412.318
        baseline_date:
          type: [string, "null"]
          format: date
          description: |
            Date of `baseline_value`. May lie before `from`; if
            `installed_at` is `null` and no month-end value before `from` is
            known, it is the date of the first known value and may lie inside
            the range.
          example: "2024-12-31"
        baseline_origin: { $ref: "#/components/schemas/BaselineOrigin" }
        readings:
          type: array
          description: |
            One month-end reading per calendar month inside both the query
            range and the installation window, ascending. Months without a
            value are omitted. Never finer than monthly.
          items: { $ref: "#/components/schemas/MeterReading" }
        period_consumption:
          $ref: "#/components/schemas/PeriodConsumption"

    BaselineOrigin:
      type: string
      description: |
        Where the segment's `baseline_value` comes from. Optional: a response
        without the field says nothing about the origin. Tolerate values not
        listed here. *(Added in rc.3 addendum.)*
        - `recorded` — a start value recorded for this device: its value at
          installation (replacement device) or a recorded start value at the
          beginning of the range
        - `assumed_zero` — the start value of a replacement heat cost
          allocator was **not recorded** and is assumed to be 0 — the
          consumption of that segment rests on this assumption. A recorded
          start value always takes precedence.
        - `first_reading` — replacement device without a recorded start
          value: the first reading after installation. Consumption between
          installation and that reading is not included.
        - `portal_rule` — device installed before the period; start value
          determined the way the landlord portal determines it for its
          billing period
        - `month_end_before_range` — device installed before the range (or
          installation date unknown): the month-end value of the month
          before `from`
        - `first_known_in_range` — installation date unknown and no month-end
          value before `from`: the first known month-end value, which lies
          **inside** the range
        - `none` — no start value known; `baseline_value` and
          `baseline_date` are `null`
      enum: [recorded, assumed_zero, first_reading, portal_rule, month_end_before_range, first_known_in_range, none]
      example: "month_end_before_range"

    PeriodConsumption:
      type: object
      description: |
        Consumption of this device segment inside the query range, computed
        the same way as in the landlord portal. `billable_value` is the
        number to bill for the measuring point; sum it across the segments
        of a measuring point. For a UsageUnit, bill
        `weighted_billable_value` (set in `/usage-units/{id}/consumption`).
      required: [end_date, end_value, status, value, billable_value]
      properties:
        end_date:
          type: string
          format: date
          description: |
            Date of `end_value`: the removal date if the device left inside the
            range, otherwise the effective end of the range. A value missing
            on that date is never replaced by an earlier one
            (`status = missing`).
          example: "2025-12-31"
        end_value:
          type: [number, "null"]
          description: |
            Meter value at `end_date` — for a removal inside the range, the
            value on the removal day (status `measured`). `null` when
            `status = missing`.
          example: 20.047
        status: { $ref: "#/components/schemas/ReadingStatus" }
        substitution_method: { $ref: "#/components/schemas/SubstitutionMethod" }
        value:
          type: [number, "null"]
          description: Raw consumption, `end_value − baseline_value`. `null` when `status = missing`.
          example: 20.043
        billable_value:
          type: [number, "null"]
          description: |
            `value × factor`. **`0` when `status = calibration_expired`** (the
            device must not be billed), `null` when `status = missing`.
            The device's value — never weighted by a unit share.
          example: 20.043
        weighted_billable_value:
          type: [number, "null"]
          description: |
            `billable_value × unit_share` of the enclosing measuring point,
            rounded like `billable_value` — the number to bill **for the
            queried UsageUnit**. Set only in `/usage-units/{id}/consumption`;
            equals `billable_value` for an unshared measuring point. Summed
            over the units of a shared sector it gives the sector's
            consumption. `null` when `billable_value` is `null`.
            *(Added in rc.3 addendum.)*
          example: 20.043

    MeterReading:
      type: object
      required: [at, value, status, is_synthetic]
      description: A month-end value (Monatsendwert / Stichtagswert).
      properties:
        at:
          type: string
          format: date
          description: |
            Last day of a calendar month; the value is the meter reading at
            the end of that day. *(Changed in rc.3: was a date-time.)*
          example: "2025-01-31"
        value: { type: number, example: 1234.567 }
        status:
          $ref: "#/components/schemas/ReadingStatus"
        is_synthetic:
          type: boolean
          description: |
            `true` when messpunkt.io derived the value (interpolated at the
            month boundary or extrapolated) instead of receiving it from the
            device. `false` for values the device reported or stored itself.
            Independent of `status`: a `calibration_expired` value can be
            synthetic.
        substitution_method: { $ref: "#/components/schemas/SubstitutionMethod" }

    ReadingStatus:
      type: string
      description: |
        How a value was obtained.
        - `measured` — reported by the device for that date (telegram or
          device-stored Stichtagswert)
        - `calculated` — interpolated by messpunkt.io at a month boundary
          between two real readings (`is_synthetic: true`)
        - `substituted` — extrapolated from recent readings because the device
          has not reported since (only at the end of a range, readings at most
          20 days old; `is_synthetic: true`). **Not produced today**: ranges
          end at a completed month end, where messpunkt.io stores only
          `calculated` values.
        - `missing` — no value could be determined; appears only on
          `period_consumption`
        - `calibration_expired` — the device's statutory calibration period
          (Eichfrist) had ended; the value is shown for information and
          **must not be billed** *(added in rc.3)*. Takes precedence over
          `calculated`: an interpolated value of such a device has this
          status with `is_synthetic: true`.
      enum: [measured, substituted, calculated, missing, calibration_expired]

    SubstitutionMethod:
      type: [string, "null"]
      description: |
        How a `calculated` or `substituted` value was derived; `null`
        otherwise (also for `calibration_expired`, even when interpolated).
        Today only the two `calculated` methods occur — `substituted` is not
        produced (see *Value status* in the API overview).

        For `calculated` month-end values:
        - `linear_interpolation` — day-proportional between the neighbouring
          readings (water, electricity, gas)
        - `degree_day_weighted` — weighted by monthly degree days (VDI 2067;
          heat meters and heat cost allocators)

        For `substituted` end values *(added in rc.3)*:
        - `weighted_recent_2values`, `weighted_recent_3values` — daily rate
          from the last 2 or 3 readings of the past 20 days, most recent
          weighted highest, carried forward to the end date
        - `baseline_fallback` — daily rate from the baseline to the last
          reading (recent readings all on the same day)
        - `baseline_single_value` — daily rate from the baseline to the only
          recent reading

        `last_value_forward` is **not assigned today** and kept for
        compatibility with rc.2.
      enum:
        - null
        - linear_interpolation
        - degree_day_weighted
        - weighted_recent_2values
        - weighted_recent_3values
        - baseline_fallback
        - baseline_single_value
        - last_value_forward

    Metric:
      type: string
      description: |
        What a measuring point measures. See *Metrics and units* in the API
        overview for the full table.

        | Value | German meter type | Unit |
        | --- | --- | --- |
        | `heat` | Wärmezähler (WMZ) | `kWh` |
        | `hca` | Heizkostenverteiler (HKV) | `unit` |
        | `water_cold` | Kaltwasserzähler | `m3` |
        | `water_warm` | Warmwasserzähler | `m3` |
        | `water_outdoor` | Außenwasserzähler — **not** part of the water billed to residents *(added in rc.3)* | `m3` |
        | `electricity` | Stromzähler — reserved, no readable devices today | `kWh` |
        | `gas` | Gaszähler — reserved, no readable devices today | `m3` |
      enum:
        - heat
        - hca
        - water_cold
        - water_warm
        - water_outdoor
        - electricity
        - gas

    MetricUnit:
      type: string
      description: |
        Physical unit of the reading's `value`. Normalised on the server side —
        every `Metric` resolves to exactly one `MetricUnit`, so ERPs do not
        need to perform unit conversion:

        - `kWh` — energy (`heat`, `electricity`)
        - `m3`  — volume (`water_cold`, `water_warm`, `water_outdoor`, `gas`)
        - `unit` — dimensionless HKV-Einheiten (`hca`)
      enum:
        - kWh
        - m3
        - unit

    Problem:
      description: RFC 7807 problem document.
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: Stable error identifier `https://developer.messpunkt.io/errors/#<code>`; branch on its fragment (see *Errors*).
          example: "https://developer.messpunkt.io/errors/#invalid-request"
        title:
          type: string
          description: Short English summary. May change; do not branch on it.
          example: "Invalid request"
        status:
          type: integer
          example: 400
        detail:
          type: string
          description: English explanation of this occurrence.
          example: "to must be on or after from"
        instance:
          type: string
          format: uri
        trace_id:
          type: string
          description: Correlate with server logs when opening a support ticket.
          example: "e9048b1072c8443b"
