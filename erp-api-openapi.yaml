servers:
  - url: https://api.sandbox.messpunkt.io/v1
    description: Sandbox — live, Try-it-out-enabled (default). Synthetic data, no PII.
  - url: https://api.messpunkt.io/v1
    description: Production (V1) — live since 2026-09-30. Landlords' real data; ERP clients are registered on request, API access is enabled per customer organisation.

security:
  - OAuth2: [read:units, read:devices, read:readings]

tags:
  - name: Introspection
    description: Who is calling, for which Tenant, with which scopes.
  - name: Properties
    description: Liegenschaften — top-level grouping of UsageUnits under a Tenant.
  - name: Units
    description: Usage units (Wohn-/Gewerbeeinheiten) and their consumption.
  - name: Measuring points
    description: Individual measuring points, their current device and month-end readings.

paths:
  /whoami:
    get:
      tags: [Introspection]
      summary: Return identity and scopes of the current token
      description: |
        Lightweight token-introspection endpoint. ERPs should call this once
        after obtaining a token to verify the tenant and granted scopes
        before deeper queries.

        If the landlord's API access has ended, the call returns
        `401 invalid-token` like every other endpoint — never `404`. Start a
        new authorization flow.
      operationId: whoami
      security:
        - OAuth2: []
      x-codeSamples:
        - lang: curl
          label: curl
          source: |
            curl -s https://api.sandbox.messpunkt.io/v1/whoami \
              -H "Authorization: Bearer $TOKEN"
        - lang: C#
          label: C# (HttpClient)
          source: |
            using var http = new HttpClient();
            http.DefaultRequestHeaders.Authorization =
                new AuthenticationHeaderValue("Bearer", accessToken);
            var who = await http.GetFromJsonAsync<WhoAmI>(
                "https://api.sandbox.messpunkt.io/v1/whoami");
            Console.WriteLine($"{who.TenantName} — {who.PropertyScope.Count} property/ies");
        - lang: TypeScript
          label: TypeScript (fetch)
          source: |
            const res = await fetch(
              "https://api.sandbox.messpunkt.io/v1/whoami",
              { headers: { Authorization: `Bearer ${accessToken}` } }
            );
            const who = await res.json();
            console.log(`${who.tenant_name} — ${who.property_scope.length} property/ies`);
        - lang: Python
          label: Python (httpx)
          source: |
            import httpx
            r = httpx.get(
                "https://api.sandbox.messpunkt.io/v1/whoami",
                headers={"Authorization": f"Bearer {access_token}"},
            )
            r.raise_for_status()
            print(r.json()["tenant_name"])
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhoAmI"
              examples:
                selected_properties:
                  summary: Landlord selected two Properties
                  value:
                    tenant_id: "9bb2c1ee-39c9-4eca-a83c-522e43c7be27"
                    tenant_name: "Musterhausverwaltung GmbH"
                    client_id: "erp-client-01"
                    granted_scopes: ["read:units", "read:devices", "read:readings"]
                    property_scope:
                      - "718e092d-8626-4975-b800-252a7746ad08"
                      - "6d8be330-8f9d-4f75-b798-05a67c0074be"
                    token_expires_at: "2026-09-29T21:30:00Z"
                all_properties:
                  summary: Landlord chose all Properties, including future ones
                  value:
                    tenant_id: "9bb2c1ee-39c9-4eca-a83c-522e43c7be27"
                    tenant_name: "Musterhausverwaltung GmbH"
                    client_id: "erp-client-01"
                    granted_scopes: ["read:units", "read:readings"]
                    property_scope: "all"
                    token_expires_at: "2026-09-29T21:30:00Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /properties:
    get:
      tags: [Properties]
      summary: List Properties (Liegenschaften) in the current Tenant
      description: |
        Paginated list of `Property` resources (Liegenschaften) accessible
        under the current token. Use this to populate the first step of a
        two-step picker in the ERP UI (*pick the Liegenschaft, then the
        Wohneinheit*). For small Tenants, ERPs may skip this and query
        `/usage-units` directly.
      operationId: listProperties
      security:
        - OAuth2: [read:units]
      x-codeSamples:
        - lang: curl
          label: curl
          source: |
            curl -s https://api.sandbox.messpunkt.io/v1/properties \
              -H "Authorization: Bearer $TOKEN"
        - lang: C#
          label: C# (HttpClient)
          source: |
            var page = await http.GetFromJsonAsync<PagedResult<Property>>(
                "https://api.sandbox.messpunkt.io/v1/properties");
            foreach (var p in page.Data)
                Console.WriteLine($"{p.Name} ({p.UsageUnitCount} units)");
        - lang: TypeScript
          label: TypeScript (fetch)
          source: |
            const res = await fetch(
              "https://api.sandbox.messpunkt.io/v1/properties",
              { headers: { Authorization: `Bearer ${accessToken}` } }
            );
            const { data: properties } = await res.json();
            properties.forEach(p => console.log(p.name, p.usage_unit_count));
        - lang: Python
          label: Python (httpx)
          source: |
            r = httpx.get(
                "https://api.sandbox.messpunkt.io/v1/properties",
                headers={"Authorization": f"Bearer {access_token}"},
            )
            for p in r.json()["data"]:
                print(p["name"], p["usage_unit_count"])
      parameters:
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/ExternalRef"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Property" }
              example:
                next_cursor: null
                prev_cursor: null
                data:
                  - id: "718e092d-8626-4975-b800-252a7746ad08"
                    tenant_id: "9bb2c1ee-39c9-4eca-a83c-522e43c7be27"
                    external_ref: null
                    name: "Musterstraße 12-14"
                    addresses:
                      - street: "Musterstraße"
                        house_number: "12"
                        postal_code: "99999"
                        city: "Musterstadt"
                        country_code: "DE"
                      - street: "Musterstraße"
                        house_number: "14"
                        postal_code: "99999"
                        city: "Musterstadt"
                        country_code: "DE"
                    usage_unit_count: 16
                  - id: "6d8be330-8f9d-4f75-b798-05a67c0074be"
                    tenant_id: "9bb2c1ee-39c9-4eca-a83c-522e43c7be27"
                    external_ref: null
                    name: "Beispielweg 4"
                    addresses:
                      - street: "Beispielweg"
                        house_number: "4"
                        postal_code: "99998"
                        city: "Musterstadt"
                        country_code: "DE"
                    usage_unit_count: 8
        "400":
          description: Invalid paging parameter — fix the request, do not retry.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                invalid_limit:
                  summary: "`limit` outside 1–200 or not an integer"
                  value:
                    type: "https://developer.messpunkt.io/errors/#invalid-request"
                    title: "Invalid request"
                    status: 400
                    detail: "limit must be an integer between 1 and 200."
                    trace_id: "7c2e19a0d4b35f81"
                invalid_page_cursor:
                  summary: "`page_cursor` not issued by this API"
                  value:
                    type: "https://developer.messpunkt.io/errors/#invalid-request"
                    title: "Invalid request"
                    status: 400
                    detail: "page_cursor is not valid."
                    trace_id: "1d8f4b6e20a97c53"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /properties/{id}:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      tags: [Properties]
      summary: Get a single Property (Liegenschaft)
      description: |
        Returns Property metadata including its addresses and a unit count.
        The list of UsageUnits for this Property is available via
        `GET /usage-units?property_id={id}` (paginated).
      operationId: getProperty
      security:
        - OAuth2: [read:units]
      x-codeSamples:
        - lang: curl
          label: curl
          source: |
            curl -s https://api.sandbox.messpunkt.io/v1/properties/$PROPERTY_ID \
              -H "Authorization: Bearer $TOKEN"
        - lang: Python
          label: Python (httpx)
          source: |
            r = httpx.get(
                f"https://api.sandbox.messpunkt.io/v1/properties/{property_id}",
                headers={"Authorization": f"Bearer {access_token}"},
            )
            if r.status_code == 404:
                print("Property not visible under this connection")  # deleted or out of scope
            else:
                print(r.json()["name"])
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Property" }
              example:
                id: "718e092d-8626-4975-b800-252a7746ad08"
                tenant_id: "9bb2c1ee-39c9-4eca-a83c-522e43c7be27"
                external_ref: null
                name: "Musterstraße 12-14"
                addresses:
                  - street: "Musterstraße"
                    house_number: "12"
                    postal_code: "99999"
                    city: "Musterstadt"
                    country_code: "DE"
                  - street: "Musterstraße"
                    house_number: "14"
                    postal_code: "99999"
                    city: "Musterstadt"
                    country_code: "DE"
                usage_unit_count: 16
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /properties/{id}/measuring-points:
    parameters:
      - $ref: "#/components/parameters/PropertyId"
    get:
      tags: [Measuring points]
      summary: List all measuring points of a Property, with and without a usage unit
      description: |
        Returns **every** active measuring point of the Property as a
        `MeasuringPoint`: those of a usage unit (`usage_unit_id` set) and
        those in areas allocated to no unit, such as a plant room or a main
        meter (`usage_unit_id: null`, `allocations: []`). The latter are not
        reachable through `GET /usage-units` and are what you need for a
        total (for example the total heat meter of a heating-cost
        statement). See *Sectors without a share* in the API overview.

        Sorted by `localization`, then `id`; paginated like the other lists.
        Difference meters are listed with `active_device: null`; the
        pre-measuring points of a landlord's own bookkeeping are not part of
        the API. Values: `GET /measuring-points/{id}/readings`.

        Unknown Property, or one outside the granted scope: `404`.
      operationId: listPropertyMeasuringPoints
      security:
        - OAuth2: [read:devices]
      x-codeSamples:
        - lang: curl
          label: curl
          source: |
            curl -s -H "Authorization: Bearer $TOKEN" \
              "https://api.sandbox.messpunkt.io/v1/properties/$PROPERTY_ID/measuring-points?limit=100"
        - lang: Python
          label: Python (httpx) — the property's total meters
          source: |
            r = httpx.get(
                f"https://api.sandbox.messpunkt.io/v1/properties/{property_id}/measuring-points",
                headers={"Authorization": f"Bearer {access_token}"},
            )
            totals = [m for m in r.json()["data"] if m["usage_unit_id"] is None]  # first page; follow next_cursor
      parameters:
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/MeasuringPoint" }
              example:
                next_cursor: null
                prev_cursor: null
                data:
                  - id: "e7a1c3d2-58b4-4f0e-9c6a-3b2d1f0a8e57"
                    usage_unit_id: null
                    property_id: "718e092d-8626-4975-b800-252a7746ad08"
                    metric: "heat"
                    obis: null
                    unit: "kWh"
                    allocations: []
                    localization: "Technikraum Gesamtwärmezähler"
                    is_difference_meter: false
                    is_system_linked: true
                    active_device:
                      id: "3f6b9d10-72c4-4a8e-b5d1-0e9c8a7b6d54"
                      serial: "70815099"
                      manufacturer: "SON"
                      device_type: "HeatMeter"
                      installed_at: "2019-03-01"
                      deinstalled_at: null
                      replacement_reason: null
                      resolution: null
                      factor: 1
                  - id: "a45f8b4a-d595-49e0-8217-dd0b1c4a600f"
                    usage_unit_id: "08d23bb4-0001-40f3-bd99-40bf33931365"
                    property_id: "718e092d-8626-4975-b800-252a7746ad08"
                    metric: "water_warm"
                    obis: null
                    unit: "m3"
                    allocations:
                      - { usage_unit_id: "08d23bb4-0001-40f3-bd99-40bf33931365", share: 1 }
                    localization: "Badezimmer Steigstrang"
                    is_difference_meter: false
                    is_system_linked: true
                    active_device:
                      id: "a263c9ee-8efa-4760-8be0-b6782e0f73d6"
                      serial: "12347"
                      manufacturer: "SON"
                      device_type: "HotWaterMeter"
                      installed_at: "2025-06-12"
                      deinstalled_at: null
                      replacement_reason: null
                      resolution: null
                      factor: 1
        "400":
          description: Invalid paging parameter — fix the request, do not retry.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                invalid_limit:
                  summary: "`limit` outside 1–200 or not an integer"
                  value:
                    type: "https://developer.messpunkt.io/errors/#invalid-request"
                    title: "Invalid request"
                    status: 400
                    detail: "limit must be an integer between 1 and 200."
                    trace_id: "7c2e19a0d4b35f81"
                invalid_page_cursor:
                  summary: "`page_cursor` not issued by this API"
                  value:
                    type: "https://developer.messpunkt.io/errors/#invalid-request"
                    title: "Invalid request"
                    status: 400
                    detail: "page_cursor is not valid."
                    trace_id: "1d8f4b6e20a97c53"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /usage-units:
    get:
      tags: [Units]
      summary: List usage units in the current Tenant
      description: |
        Paginated list of `UsageUnit` resources accessible under the current
        token. Used by the ERP to present a picker for linking a
        messpunkt.io unit to the ERP's own unit record (with prefilled
        address, floor and position).
      operationId: listUsageUnits
      security:
        - OAuth2: [read:units]
      x-codeSamples:
        - lang: curl
          label: curl
          source: |
            curl -s -H "Authorization: Bearer $TOKEN" \
              "https://api.sandbox.messpunkt.io/v1/usage-units?property_id=$PROPERTY_ID&limit=50"
        - lang: TypeScript
          label: TypeScript (fetch, all pages)
          source: |
            let cursor: string | null = null;
            do {
              const url = new URL("https://api.sandbox.messpunkt.io/v1/usage-units");
              url.searchParams.set("property_id", propertyId);
              if (cursor) url.searchParams.set("page_cursor", cursor);
              const page = await (await fetch(url, {
                headers: { Authorization: `Bearer ${accessToken}` }
              })).json();
              page.data.forEach(u => console.log(u.name, u.floor, u.position));
              cursor = page.next_cursor;
            } while (cursor);
      parameters:
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/ExternalRef"
        - name: property_id
          in: query
          description: Limit to units in a single Property.
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/UsageUnit" }
              example:
                next_cursor: null
                prev_cursor: null
                data:
                  - id: "08d23bb4-0001-40f3-bd99-40bf33931365"
                    tenant_id: "9bb2c1ee-39c9-4eca-a83c-522e43c7be27"
                    property_id: "718e092d-8626-4975-b800-252a7746ad08"
                    property:
                      id: "718e092d-8626-4975-b800-252a7746ad08"
