  /usage-units/{id}/consumption:
    parameters:
      - $ref: "#/components/parameters/UsageUnitId"
    get:
      tags: [Units]
      summary: Monthly readings and period consumption for a usage unit
      description: |
        **Primary read endpoint.**

        Returns, for every MeasuringPoint of the unit, the device segments in
        the query range with their month-end readings and their billable
        period consumption. Meter replacements appear as separate segments,
        so the ERP never has to diff serials to detect a swap.

        Resolution is **monthly at the finest** — see *Data resolution* and
        *Meter readings and consumption* in the API overview. `from` / `to`
        are widened to whole months; the response echoes the effective range.

        A MeasuringPoint without any value in the range is returned with
        `data_gap: true` — never silently omitted. Difference meters are
        returned with `is_difference_meter: true` and no segments.

        A measuring point of a Sector shared with other units is listed here
        with this unit's `unit_share`; bill
        `period_consumption.weighted_billable_value` (= `billable_value` ×
        `unit_share`). See *Shared Sectors* in the API overview.
      operationId: getUsageUnitConsumption
      security:
        - OAuth2: [read:readings]
      x-codeSamples:
        - lang: curl
          label: curl
          source: |
            curl -s -H "Authorization: Bearer $TOKEN" \
              "https://api.sandbox.messpunkt.io/v1/usage-units/$UNIT_ID/consumption?from=2025-01-01&to=2025-12-31&metric=water_warm"
        - lang: C#
          label: C# (HttpClient)
          source: |
            var url = $"https://api.sandbox.messpunkt.io/v1/usage-units/{unitId}" +
                     "/consumption?from=2025-01-01&to=2025-12-31&metric=water_warm";
            var doc = await http.GetFromJsonAsync<UnitConsumption>(url);
            foreach (var mp in doc.MeasuringPoints)
            {
                // billable = sum over segments; never last − first reading;
                // weighted_billable_value = this unit's share of a shared meter
                var billable = mp.Segments.Sum(s =>
                    s.PeriodConsumption.WeightedBillableValue ?? s.PeriodConsumption.BillableValue ?? 0m);
                Console.WriteLine($"{mp.Metric}: {billable:F3} {mp.Unit}");
            }
        - lang: TypeScript
          label: TypeScript (fetch)
          source: |
            const url =
              `https://api.sandbox.messpunkt.io/v1/usage-units/${unitId}` +
              `/consumption?from=2025-01-01&to=2025-12-31&metric=water_warm`;
            const doc = await (await fetch(url, {
              headers: { Authorization: `Bearer ${accessToken}` }
            })).json();
            for (const mp of doc.measuring_points) {
              // billable = sum over segments; never last − first reading;
              // weighted_billable_value = this unit's share of a shared meter
              const billable = mp.segments.reduce((sum, s) => sum +
                (s.period_consumption.weighted_billable_value ?? s.period_consumption.billable_value ?? 0), 0);
              console.log(mp.metric, billable, mp.unit);
            }
        - lang: Python
          label: Python (httpx)
          source: |
            url = (
                f"https://api.sandbox.messpunkt.io/v1/usage-units/{unit_id}"
                "/consumption?from=2025-01-01&to=2025-12-31&metric=water_warm"
            )
            doc = httpx.get(url, headers={"Authorization": f"Bearer {access_token}"}).json()
            for mp in doc["measuring_points"]:
                # billable = sum over segments; never last − first reading;
                # weighted_billable_value = this unit's share of a shared meter
                def to_bill(pc):
                    v = pc.get("weighted_billable_value")
                    return (pc["billable_value"] if v is None else v) or 0
                billable = sum(to_bill(s["period_consumption"]) for s in mp["segments"])
                print(mp["metric"], billable, mp["unit"])
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: metric
          in: query
          description: |
            Optional filter, comma-separated (`metric=heat,hca`). Omit to
            return all metrics. An unknown value is rejected with `400`
            naming the value — it is never silently ignored, because an
            ignored filter would widen the result.
          required: false
          schema:
            type: array
            items: { $ref: "#/components/schemas/Metric" }
          style: form
          explode: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnitConsumption" }
              examples:
                single_unit:
                  summary: Warm-water meter with a replacement inside the range
                  value:
                    usage_unit_id: "08d23bb4-0001-40f3-bd99-40bf33931365"
                    external_ref: null
                    from: "2025-01-01"
